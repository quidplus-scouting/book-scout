name: Aggiornamento settimanale

on:
  schedule:
    - cron: "0 5 * * 1"   # ogni lunedi' alle 5:00 UTC
  workflow_dispatch:       # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scout.py
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
      - name: Salva i risultati
        run: |
          git config user.name "book-scout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data
          git commit -m "Aggiornamento $(date +%Y-%m-%d)" || echo "Nessuna modifica"
          git push
